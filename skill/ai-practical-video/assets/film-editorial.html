 if(calendarRecipe&&state.kind==='input'&&dt>1){const q=dt<4?0:1;ring(25,q===0?274:390,581,57)}

}
function subtitles(t){let c=T.captions.find(c=>t>=c.start&&t<c.end);state.captionBoxes=[];rr(68,1594,880,153,24,P.ink,null);if(c){let size=43,rows=wrap(c.text,size,800);while(rows.length>2&&size>34){size-=1;rows=wrap(c.text,size,800)}

async function source(s,t){if(!s.video)throw Error('真实录屏镜头缺少视频: '+s.id);if(currentSrc!==s.video){currentSrc=s.video;V.src=s.video;lastSourceTime=null;await new Promise((resolve,reject)=>{if(V.readyState>=1)return resolve();V.onloadedmetadata=resolve;V.onerror=()=>reject(Error('无法读取录屏 '+s.video))})}const clipEnd=Number.isFinite(s.clip_end)?s.clip_end:V.duration-.08;const target=clamp((s.clip_start||0)+Math.min(t-s.start,Math.max(0,clipEnd-(s.clip_start||0))),0,V.duration-.08);if(lastSourceTime===null||Math.abs(V.currentTime-target)>.009){await new Promise((resolve,reject)=>{V.onseeked=resolve;V.onerror=()=>reject(Error('录屏定位失败'));V.currentTime=target})}await new Promise(r=>requestAnimationFrame(r));lastSourceTime=target;state.sourceReady=V.readyState>=2&&V.videoWidth>0;return target}
